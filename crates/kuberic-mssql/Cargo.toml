[package]
name = "kuberic-mssql"
description = "Observe-only SQL Server availability group runtime for Kuberic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
kuberic = ["dep:kuberic-runtime", "kuberic-runtime/host"]
kuberic-testing = ["kuberic", "kuberic-runtime/testing"]

[[bin]]
name = "sqlserver-observer"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
clap.workspace = true
futures.workspace = true
kuberic-runtime = { workspace = true, optional = true }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tiberius.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["compat", "rt"] }
zeroize.workspace = true
