name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlserver-observer-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  NEXTEST_ARCHIVE: target/nextest/mssql-tests.tar.zst

jobs:
  build-test-artifacts:
    name: Check and build test archive
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
          build-warnings: ""
      - name: Bootstrap shared tools
        run: bash crates/kuberic-mssql-tests/scripts/setup_environment.sh
      - name: Check and build reusable archive
        run: just ci-build-nextest-archive "$NEXTEST_ARCHIVE"
      - name: Upload compiled test archive only
        uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: ${{ env.NEXTEST_ARCHIVE }}
          compression-level: 0
          retention-days: 1

  test-shards:
    name: Tests (${{ matrix.partition }}/4)
    needs: build-test-artifacts
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        partition: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: ""
          cache: false
      - name: Bootstrap shared tools
        run: bash crates/kuberic-mssql-tests/scripts/setup_environment.sh
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: target/nextest
      - name: Validate exact test coverage
        if: ${{ matrix.partition == 1 }}
        timeout-minutes: 30
        run: just validate-nextest-archive "$NEXTEST_ARCHIVE"
      - name: Report blocked licensed coverage
        if: ${{ matrix.partition == 1 }}
        run: python3 crates/kuberic-mssql-tests/scripts/live_coverage.py >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare isolated archive extraction
        id: extraction
        run: |
          directory="$(mktemp -d "$GITHUB_WORKSPACE/target/nextest-extracted.XXXXXXXXXX")"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
      - name: Run ordinary and serial SQL partition without rebuilding
        id: tests
        run: just test-nextest-archive "$NEXTEST_ARCHIVE" "${{ matrix.partition }}" "${{ steps.extraction.outputs.directory }}"
      - name: Release owned fixture resources after failure or cancellation
        if: always() && steps.tests.outcome != 'skipped' && steps.tests.outcome != ''
        run: just cleanup-nextest-archive "${{ steps.extraction.outputs.directory }}"

  validation:
    name: Shared CI validation
    if: always()
    needs: [build-test-artifacts, test-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every archive stage and worker
        env:
          BUILD_RESULT: ${{ needs.build-test-artifacts.result }}
          TEST_RESULT: ${{ needs.test-shards.result }}
        run: |
          echo "build=$BUILD_RESULT tests=$TEST_RESULT"
          test "$BUILD_RESULT" = success
          test "$TEST_RESULT" = success
