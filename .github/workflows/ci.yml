name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlserver-observer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Shared CI validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
          build-warnings: ""
      - name: Bootstrap shared tools
        run: bash crates/kuberic-mssql-tests/scripts/setup_environment.sh
      - name: Run the same complete pipeline used locally
        id: validation
        run: just ci
      - name: Release owned fixture resources after failure or cancellation
        if: always() && steps.validation.outcome != 'skipped' && steps.validation.outcome != ''
        run: just cleanup
