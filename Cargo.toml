[workspace]
members = [
    "crates/kuberic-mssql",
    "crates/kuberic-mssql-tests",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/youyuanwu/kuberic-mssql"
rust-version = "1.85"
publish = false

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
kuberic-mssql = { path = "crates/kuberic-mssql", default-features = false }
kuberic-runtime = { version = "=0.0.1", default-features = false }
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "rustls"] }
tokio = "1"
tokio-util = "0.7"
zeroize = "1"

[patch.crates-io]
# Custom authority validation must complete before durable authority publication.
kuberic-runtime = { git = "https://github.com/youyuanwu/kuberic.git", rev = "57c96ce45a596a66334d0ae4c3d4b8a09cca79c1" }
